name: iOS build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "core/**"
      - "mobile-host/**"
      - ".github/workflows/ios.yml"

jobs:
  build-ios:
    runs-on: macos-14
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Read app version
        id: app_version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' ios/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Import signing certificate and provisioning profile
        id: signing
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.IOS_TEAM_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ykw2-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" -o "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        if: ${{ steps.signing.outcome == 'success' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/YKW2Port.xcodeproj \
            -scheme YKW2Port \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YKW2Port.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.PROFILE_UUID }}" \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Export signed IPA
        if: ${{ steps.signing.outcome == 'success' }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string development' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.ykw2.port.ios string ${{ steps.signing.outputs.PROFILE_NAME }}" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YKW2Port.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/exported"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' ios/Info.plist)
          cp "$RUNNER_TEMP/exported/YKW2Port.ipa" "$GITHUB_WORKSPACE/YKW2Port-v${VERSION}-signed.ipa"

      - name: Archive unsigned validation build
        if: ${{ steps.signing.outcome != 'success' }}
        run: |
          set -euo pipefail
          if ! xcodebuild \
              -quiet \
              -project ios/YKW2Port.xcodeproj \
              -scheme YKW2Port \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/YKW2Port.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/archive.log"; then
            SUMMARY="$(grep -Ei 'error:|fatal error:|undefined|requires a provisioning|provisioning profile|no such file|failed' "$RUNNER_TEMP/archive.log" | tail -40 | tr '\r\n' ' ' | sed 's/%/%25/g')"
            if [ -z "$SUMMARY" ]; then
              SUMMARY="$(tail -40 "$RUNNER_TEMP/archive.log" | tr '\r\n' ' ' | sed 's/%/%25/g')"
            fi
            echo "::error title=xcodebuild failed::$SUMMARY"
            exit 1
          fi
          APP="$RUNNER_TEMP/YKW2Port.xcarchive/Products/Applications/YKW2Port.app"
          /usr/libexec/PlistBuddy -c 'Print:CFBundleExecutable' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$APP/Info.plist"
          test -x "$APP/YKW2Port"
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/YKW2Port.xcarchive/Products/Applications/YKW2Port.app" "$RUNNER_TEMP/unsigned/Payload/"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' ios/Info.plist)
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$GITHUB_WORKSPACE/YKW2Port-v${VERSION}-unsigned.ipa" Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YKW2Port-v${{ steps.app_version.outputs.version }}-${{ steps.signing.outcome == 'success' && 'signed-ipa' || 'unsigned-validation-ipa' }}
          path: YKW2Port-*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YKW2Port-xcode-logs
          path: |
            ${{ runner.temp }}/YKW2Port.xcarchive/**
            ${{ runner.temp }}/DerivedData/Logs/**
            ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
          retention-days: 7
